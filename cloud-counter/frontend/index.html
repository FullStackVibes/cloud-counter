<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudCounter</title>
  <!-- Plain HTML5 layout using Tailwind CSS via public CDN link -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <main class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl text-center flex flex-col items-center justify-between min-h-[380px]">
    
    <!-- Main Title -->
    <header class="w-full">
      <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wider uppercase mb-3">
        Milestone 2
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">CloudCounter</h1>
      <p class="text-slate-400 text-sm mt-1">Client-Server Mechanics</p>
    </header>

    <!-- Central Text Display showing the current global counter value -->
    <div class="my-8 flex flex-col items-center justify-center">
      <div id="counter-display" class="text-8xl sm:text-9xl font-black tracking-tighter text-indigo-400 select-none transition-transform duration-150 ease-out">
        0
      </div>
      <div id="status-message" class="text-xs text-slate-500 mt-4 h-4 font-medium transition-colors">
        Connecting to API...
      </div>
    </div>

    <!-- Three distinct buttons styled with custom colors (Green for Increment, Red for Decrement, Gray for Reset) -->
    <div class="w-full flex flex-col gap-3">
      <div class="grid grid-cols-2 gap-3 w-full">
        <button 
          id="increment-btn" 
          data-action="increment"
          type="button"
          class="w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-600/30 hover:shadow-emerald-600/50 transform active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-4 focus:ring-emerald-500/30 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-1.5">
          <span>+ Increment</span>
        </button>
        <button 
          id="decrement-btn" 
          data-action="decrement"
          type="button"
          class="w-full py-4 px-4 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-rose-600/30 hover:shadow-rose-600/50 transform active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-4 focus:ring-rose-500/30 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-1.5">
          <span>- Decrement</span>
        </button>
      </div>
      <button 
        id="reset-btn" 
        data-action="reset"
        type="button"
        class="w-full py-3 px-6 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 font-semibold text-base rounded-xl shadow-md shadow-slate-900/30 hover:shadow-slate-700/50 transform active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-4 focus:ring-slate-500/30 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2">
        <span>↺ Reset</span>
      </button>
    </div>
  </main>

  <!-- Frontend application logic script -->
  <script src="app.js"></script>
</body>
</html>
